                description: "Беда пришла откуда не ждали. Три недели лили беспрерывные дожди, а затем ударили ранние сентябрьские заморозки. Рожь погнила на корню, овес не взошел. Крестьяне подмосковных сел начали есть древесную кору и лебеду. В столице начались голодные бунты, чернь угрожает разгромить дворы богатых бояр. Государственные великокняжеские амбары еще полны зерна на случай войны. Архиепископ умоляет открыть житницы и раздать хлеб бесплатно во имя милосердия. Казначей возражает: если отдать резервы сейчас, весной нечем будет сеять, а казна лишится главного экспортного товара для торговли с немцами.", 
                options: [
                    { text: "Приказать открыть амбары и кормить чернь за счет княжеской казны", risk: "Пустая казна и финансовый крах" }, 
                    { text: "Приставить к житницам вооруженных стрельцов и жестко продавать хлеб по высокой цене", risk: "Кровавые восстания и ненависть народа" }
                ] 
            },
            { 
                title: "Мятеж Боярской Аристократии", 
                description: "Политика собирания земель вокруг Москвы и усиление личной власти Великого князя вызвали глухое недовольство старой родовитой знати. Влиятельные боярские кланы, привыкшие к вольностям и праву «отъезда», тайно собираются в своих вотчинах. Доносчики сообщают, что готовится заговор: бояре планируют сместить князя, заменив его марионеточным родственником, и навязать «Грамоту вольностей». Верный воевода предлагает сыграть на опережение — ввести опричные отряды в дворы заговорщиков, казнить зачинщиков и конфисковать земли. Дипломаты советуют собрать Земский собор и торжественно подтвердить часть старых боярских привилегий, чтобы избежать гражданской войны.", 
                options: [
                    { text: "Обрушить меч правосудия! Арестовать изменников, пролить кровь и забрать вотчины", risk: "Раскол элит и гибель опытных командиров" }, 
                    { text: "Вызвать бояр на пир, выслушать их требования и подписать компромиссную грамоту", risk: "Ослабление власти и падение авторитета князя" }
                ] 
            },
            { 
                title: "Моровое Поветрие (Чума)", 
                description: "По речным путям с юга в Москву проникла страшная гостья — «черная смерть». В Замоскворечье начали массово умирать ремесленники, на дверях десятков изб появились черные кресты. Ужас охватил столицу. Торговля встала, улицы опустели, слышен лишь звон погребальных колоколов. Иноземные лекари требуют немедленно закрыть все городские заставы, сжигать зараженные дворы вместе с имуществом и запретить людям выходить из домов. Духовенство же настаивает, что мор — это кара за грехи, и призывает собрать весь город на грандиозный крестный ход и непрерывные коллективные молебны на Красной площади.", 
                options: [
                    { text: "Ввести жесточайший карантин, перекрыть дороги и остановить любые торги", risk: "Полный паралич экономики и обнищание" }, 
                    { text: "Собрать многотысячный крестный ход и раздавать щедрую милостыню из казны", risk: "Катастрофическое распространение болезни в толпе" }
                ] 
            },
            { 
                title: "Великий Пожар на Посаде", 
                description: "От искры в кузнице Зарядья вспыхнул катастрофический пожар. Из-за сильного сухого ветра пламя мгновенно охватило плотную деревянную застройку. Целые кварталы ремесленников, купеческие склады с дорогими сукнами и пушниной превратились в пепел. Огонь едва не перекинулся на стены Кремля. Тысячи москвичей остались без крова в преддверии суровой зимы. Итальянский зодчий предлагает издать указ о полном запрете деревянного строительства в центре и выдавать ссуды из казны на возведение дорогих каменных палат. Обездоленные погорельцы плачут и требуют разрешить им немедленно рубить дешевые сосновые избы на старых пепелищах, чтобы не замерзнуть насмерть.", 
                options: [
                    { text: "Утвердить план каменной застройки и выделить субсидии на кирпичные заводы", risk: "Опустошение хранилищ золота и серебра" }, 
                    { text: "Сжалиться над народом и разрешить быструю постройку деревянных слобод", risk: "Опасность повторного выгорания всей столицы" }
                ] 
            }
        ];

        const LOCAL_CHANCES = [
            { title: "Заморский Гость", description: "В Москву прибыло богатое посольство из Персии. Впечатленные величием княжеского приема, послы преподнесли в дар казне сундуки с серебряными дирхемами, тончайшими шелками и драгоценными каменьями. Этот непредвиденный доход позволит снарядить новые полки.", deltas: { gold: 20, army: 0, influence: 5, lands: 0 } },
            { title: "Сокровища Рюриковичей", description: "При закладке нового фундамента под белокаменный собор в Кремле, строители наткнулись на глубокий тайник. В истлевших дубовых бочках оказались спрятанные еще во времена Батыева нашествия золотые гривны и старинная утварь. Князь щедро наградил нашедших, а казна заметно отяжелела.", deltas: { gold: 25, army: 0, influence: 0, lands: 0 } },
            { title: "Мастера Оружейной Палаты", description: "Спасаясь от религиозных гонений в Европе, группа высококвалифицированных немецких и итальянских оружейников попросила убежища в Москве. В обмен на защиту они наладили производство передовых пищалей, аркебуз и крепких кирас, значительно усилив огневую мощь княжеской дружины.", deltas: { gold: 0, army: 20, influence: 5, lands: 0 } },
            { title: "Святая Благодать", description: "Выдающийся старец-монах, обладающий колоссальным духовным авторитетом на всей Руси, публично благословил политику Великого князя Московского. Он назвал Москву единственной законной наследницей Владимира и Киева. Это событие мгновенно подняло престиж столицы и заставило умолкнуть многих политических оппонентов.", deltas: { gold: 0, army: 0, influence: 25, lands: 0 } },
            { title: "Щедрость Земли Русской", description: "Выдался на редкость благоприятный год. Ранняя весна, теплое лето и своевременные дожди привели к колоссальному урожаю на всех московских землях. Амбары ломятся от зерна, ярмарки гудят от обилия товаров. Торговые пошлины текут в столицу рекой, а сытый народ прославляет мудрое правление князя.", deltas: { gold: 15, army: 5, influence: 5, lands: 0 } }
        ];

        while(LOCAL_CRISES.length < 25) { LOCAL_CRISES.push({...LOCAL_CRISES[Math.floor(Math.random() * 5)]}); }
        while(LOCAL_CHANCES.length < 10) { LOCAL_CHANCES.push({...LOCAL_CHANCES[Math.floor(Math.random() * 5)]}); }
        Object.keys(LOCAL_QUESTIONS).forEach(key => {
            while(LOCAL_QUESTIONS[key].length < 15) { LOCAL_QUESTIONS[key].push({...LOCAL_QUESTIONS[key][0]}); }
        });

        const generateTiles = () => {
            const tiles = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                if (i === 0) tiles.push({ type: 'start', label: 'МОСКВА', icon: '🏰' });
                else if (i === 10) tiles.push({ type: 'opala', label: 'ОПАЛА', icon: '🔒' });
                else if (i === 20) tiles.push({ type: 'rest', label: 'ПИР', icon: '🏆' });
                else if (i === 30) tiles.push({ type: 'go_to_opala', label: 'СУД ХАНА', icon: '🛑' });
                else if ([5, 15, 25, 35].includes(i)) tiles.push({ type: 'crisis', label: 'КРИЗИС', icon: '🔥' });
                else if ([7, 12, 22, 28, 38].includes(i)) tiles.push({ type: 'chance', label: 'ШАНС', icon: '🍀' });
                else {
                    let period = 'Конец XIII века (Даниил Александрович)';
                    if (i > 5 && i < 15) period = 'Первая половина XIV века (Иван Калита)';
                    else if (i > 15 && i < 25) period = 'Вторая половина XIV века (Дмитрий Донской)';
                    else if (i > 25 && i < 35) period = 'XV век (Василий II Темный)';
                    else if (i > 35) period = 'Конец XV - начало XVI века (Иван III)';
                    tiles.push({ type: 'question', label: 'ЛЕТОПИСЬ', period });
                }
            }
            return tiles;
        };
        const TILES = generateTiles();

        function App() {
            const [user, setUser] = useState(null);
            const [localUserId, setLocalUserId] = useState(null);
            const [gameState, setGameState] = useState(null);
            const [newTeamName, setNewTeamName] = useState('');
            const [timeLeft, setTimeLeft] = useState(0);
            const [isRolling, setIsRolling] = useState(false);
            const [diceRoll, setDiceRoll] = useState(null);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (u) setLocalUserId(u.uid);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const gameRef = db.collection('games').doc(ROOM_ID);
                gameRef.get().then(docSnap => {
                    if (!docSnap.exists) {
                        gameRef.set({ status: 'setup', teams: [], currentTurn: 0, round: 1, eventStatus: 'idle', activeEvent: null });
                    }
                });
                const unsubscribe = gameRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) setGameState(docSnap.data());
                }, console.error);
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                if (!gameState || gameState.eventStatus !== 'active' || !gameState.activeEvent?.expiresAt) {
                    setTimeLeft(0);
                    return;
                }
                const interval = setInterval(() => {
                    const remaining = Math.max(0, Math.floor((gameState.activeEvent.expiresAt - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining === 0) {
                        clearInterval(interval);
                        const currentTeam = gameState.teams[gameState.currentTurn];
                        if (currentTeam && currentTeam.ownerId === localUserId) handleTimeout();
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [gameState?.eventStatus, gameState?.activeEvent?.expiresAt, localUserId]);

            const updateGame = async (updates) => {
                await db.collection('games').doc(ROOM_ID).set(updates, { merge: true });
            };

            const addTeam = async () => {
                if (!newTeamName.trim() || !gameState || gameState.teams.length >= 4) return;
                const newTeam = {
                    id: Date.now().toString(), ownerId: localUserId, name: newTeamName.trim(), position: 0,
                    color: TEAM_COLORS[gameState.teams.length], stats: { ...INITIAL_STATS }, jailed: 0
                };
                await updateGame({ teams: [...gameState.teams, newTeam] });
                setNewTeamName('');
            };

            const startGame = () => updateGame({ status: 'playing', currentTurn: 0, round: 1, eventStatus: 'idle' });
            const resetGame = () => updateGame({ status: 'setup', teams: [], currentTurn: 0, round: 1, eventStatus: 'idle', activeEvent: null });

            const rollDice = async () => {
                if (gameState.eventStatus !== 'idle') return;
                setIsRolling(true);
                await updateGame({ eventStatus: 'rolling' });
                
                setTimeout(async () => {
                    const roll = Math.floor(Math.random() * 6) + 1;
                    setDiceRoll(roll);
                    setIsRolling(false);
                    
                    const teams = [...gameState.teams];
                    const team = teams[gameState.currentTurn];
                    
                    if (team.jailed > 0) {
                        team.jailed -= 1;
                        await updateGame({ teams, eventStatus: 'outcome', activeEvent: { type: 'info', title: 'ОПАЛА', message: `Князь отбывает повинную в ставке Хана. Осталось пропустить ходов: ${team.jailed}` }});
                        return;
                    }

                    team.position = (team.position + roll) % BOARD_SIZE;
                    
                    if (team.position === 30) {
                        team.position = 10; team.jailed = 2; 
                        await updateGame({ teams, eventStatus: 'outcome', activeEvent: { type: 'info', title: 'ВЫЗОВ К ХАНУ!', message: 'Гнев Золотой Орды! Ваш караван развернут, вы отправляетесь в ставку хана на суд и пропускаете 2 хода.' }});
                        return;
                    }

                    await updateGame({ teams, eventStatus: 'generating' });
                    triggerTileEvent(team, team.position);
                }, 1000);
            };

            const triggerTileEvent = async (team, position) => {
                const tile = TILES[position];
                if (tile.type === 'start' || tile.type === 'rest' || tile.type === 'opala') {
                    await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'info', title: tile.label, message: 'Княжество переводит дух. Казна полнится, дружина точит мечи. Ничего не происходит.' }});
                    return;
                }
                if (tile.type === 'chance') {
                    const chanceList = LOCAL_CHANCES;
                    const randomChance = chanceList[Math.floor(Math.random() * chanceList.length)];
                    await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'chance', ...randomChance } });
                    return;
                }
                if (tile.type === 'crisis') {
                    const crisisList = LOCAL_CRISES;
                    const randomCrisis = crisisList[Math.floor(Math.random() * crisisList.length)];
                    await updateGame({ eventStatus: 'active', activeEvent: { type: 'crisis', ...randomCrisis, expiresAt: Date.now() + 45000 } });
                    return;
                }
                if (tile.type === 'question') {
                    const periodQuestions = LOCAL_QUESTIONS[tile.period] || LOCAL_QUESTIONS['Конец XIII века (Даниил Александрович)'];
                    const randomQuestion = periodQuestions[Math.floor(Math.random() * periodQuestions.length)];
                    await updateGame({ eventStatus: 'active', activeEvent: { type: 'question', ...randomQuestion, expiresAt: Date.now() + 45000 } });
                    return;
                }
            };

            const handleTimeout = async () => {
                const { type } = gameState.activeEvent;
                await updateGame({ eventStatus: 'generating' }); 
                let outcomeData = type === 'question' ? {
                    title: 'ВРЕМЯ УТЕКЛО!', story: `Боярская дума потонула в спорах и не дала ответа хану. Правильный ответ: ${gameState.activeEvent.options[gameState.activeEvent.correctIndex]}. ${gameState.activeEvent.explanation}`,
                    deltas: { gold: -5, army: -5, influence: -10, lands: 0 }
                } : { title: 'ПРИГОВОР СУДЬБЫ!', story: 'Князь проявил слабость и не принял решение. Исторический кризис ударил по княжеству в полную разрушительную силу.', deltas: { gold: -15, army: -15, influence: -20, lands: -1 } };
                await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'outcome', ...outcomeData } });
            };

            const submitAnswer = async (idx) => {
                const ev = gameState.activeEvent;
                const isCorrect = idx === ev.correctIndex;
                await updateGame({ eventStatus: 'generating' });
                const storyText = isCorrect ? `Мудрое слово! ${ev.explanation}` : `Роковая ошибка. Правильный ответ: ${ev.options[ev.correctIndex]}. ${ev.explanation}`;
                const deltas = isCorrect ? { gold: 10, army: 0, influence: 15, lands: 0 } : { gold: -5, army: -5, influence: -15, lands: 0 };
                await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'outcome', title: isCorrect ? 'ИСТИНА ЛЕТОПИСИ' : 'ИСКАЖЕНИЕ ПРАВДЫ', story: storyText, deltas } });
            };

            const submitCrisisChoice = async (idx) => {
                const ev = gameState.activeEvent;
                const choice = ev.options[idx];
                await updateGame({ eventStatus: 'generating' });
                const storyText = `Тяжелое решение принято: "${choice.text}". ${choice.risk} стала жестокой платой за власть.`;
                const deltas = idx === 0 ? { gold: -20, army: 0, influence: 10, lands: 0 } : { gold: 0, army: -20, influence: -10, lands: 0 };
                await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'outcome', title: 'ИТОГИ КРИЗИСА', story: storyText, deltas } });
            };

            const completeTurn = async () => {
                const ev = gameState.activeEvent;
                const newTeams = [...gameState.teams];
                const team = newTeams[gameState.currentTurn];
                if (ev?.deltas) {
                    team.stats.gold = Math.max(0, team.stats.gold + (ev.deltas.gold || 0));
                    team.stats.army = Math.max(0, team.stats.army + (ev.deltas.army || 0));
                    team.stats.influence = Math.max(0, team.stats.influence + (ev.deltas.influence || 0));
                    team.stats.lands = Math.max(0, team.stats.lands + (ev.deltas.lands || 0));
                }
                const nextTurn = (gameState.currentTurn + 1) % gameState.teams.length;
                await updateGame({ teams: newTeams, currentTurn: nextTurn, round: nextTurn === 0 ? gameState.round + 1 : gameState.round, eventStatus: 'idle', activeEvent: null });
                setDiceRoll(null);
            };

            const getPawnPosition = (index, teamIndex) => {
                let x = 0, y = 0; const cellSize = 100 / 11; 
                if (index <= 10) { x = index * cellSize; y = 0; }
                else if (index <= 20) { x = 100 - cellSize; y = (index - 10) * cellSize; }
                else if (index <= 30) { x = (30 - index) * cellSize; y = 100 - cellSize; }
                else { x = 0; y = (40 - index) * cellSize; }
                const offset = [ {dx: 1, dy: 1}, {dx: 3, dy: 1}, {dx: 1, dy: 3}, {dx: 3, dy: 3} ][teamIndex % 4];
                return { left: `calc(${x}% + ${offset.dx}%)`, top: `calc(${y}% + ${offset.dy}%)` };
            };

            if (!user || !gameState) return <div className="min-h-screen flex items-center justify-center"><p className="text-2xl font-serif font-bold animate-pulse text-[#b8860b]">⏳ Открываем древние свитки...</p></div>;

            if (gameState.status === 'setup') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute inset-0 bg-black/60 z-0"></div>
                        <div className="max-w-lg w-full bg-[#110b08] border border-[#3d2b1f] shadow-[0_0_40px_rgba(184,134,11,0.15)] relative z-10 p-10 rounded-sm">
                            <div className="text-center text-6xl mb-6 text-[#b8860b] drop-shadow-lg">👑</div>
                            <h1 className="text-4xl font-display font-black text-center mb-2 text-[#ffd700] tracking-widest uppercase">Возвышение Москвы</h1>
                            <h2 className="text-sm font-condensed font-bold text-center mb-10 tracking-[0.3em] text-[#b8860b] border-b border-[#3d2b1f] pb-4 uppercase">Борьба за великое княжение</h2>
                            <div className="space-y-6 mb-10">
                                <div className="flex gap-2">
                                    <input type="text" value={newTeamName} onChange={e=>setNewTeamName(e.target.value)} placeholder="Имя Княжества..." className="flex-1 bg-[#080504] border border-[#3d2b1f] text-[#f4e4c1] px-5 py-3 outline-none focus:border-[#b8860b] transition-colors font-serif text-lg" />
                                    <button onClick={addTeam} disabled={!newTeamName.trim() || gameState.teams.length >= 4} className="bg-[#b8860b] hover:bg-[#daa520] px-6 py-3 text-[#080504] font-bold disabled:opacity-30 uppercase font-condensed tracking-wider transition-colors">Вступить</button>
                                </div>
                                <div className="space-y-3">
                                    {gameState.teams.map(t => (
                                        <div key={t.id} className="flex items-center gap-4 bg-[#1a120d] p-4 border-l-4 rounded-r-md shadow-inner" style={{ borderColor: t.color.replace('bg-','') }}>
                                            <div className={`w-5 h-5 rounded-sm ${t.color} shadow-sm`} /> 
                                            <span className="font-serif font-bold uppercase text-lg tracking-wider text-[#f4e4c1]">{t.name}</span>
                                            {t.ownerId === localUserId && <span className="ml-auto text-xs font-bold text-[#b8860b] bg-[#2a1d15] px-2 py-1 rounded">(ВАШ УДЕЛ)</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <button onClick={startGame} disabled={gameState.teams.length < 2} className="w-full bg-gradient-to-b from-[#b8860b] to-[#8b6508] hover:from-[#daa520] hover:to-[#b8860b] text-[#080504] py-5 font-black uppercase tracking-widest text-xl disabled:opacity-40 transition-all font-display shadow-lg rounded-sm">Начать Эпоху</button>
                        </div>
                    </div>
                );
            }

            const currentTeam = gameState.teams[gameState.currentTurn];
            const isMyTurn = currentTeam?.ownerId === localUserId;

            const renderStatBar = (value, icon, label, colorHex) => (
                <div className="mb-4">
                    <div className="flex justify-between items-end mb-1.5">
                        <div className="flex items-center gap-2 text-xs uppercase font-condensed font-bold tracking-wider text-[#a07c5a]">{icon} {label}</div>
                        <div className="text-base font-black text-[#f4e4c1] font-serif">{value}</div>
                    </div>
                    <div className="w-full h-1.5 bg-[#080504] rounded-full overflow-hidden border border-[#2a1d15]">
                        <div className="h-full transition-all duration-1000 ease-out" style={{ width: `${Math.min(100, value)}%`, backgroundColor: colorHex, boxShadow: `0 0 10px ${colorHex}` }} />
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col p-2 lg:p-6 text-[#f4e4c1] relative">
                    <div className="flex justify-between items-center mb-6 bg-gradient-to-r from-[#110b08] via-[#1a120d] to-[#110b08] p-5 border border-[#3d2b1f] shadow-[0_4px_20px_rgba(0,0,0,0.5)] rounded-sm">
                        <div className="flex items-center gap-4"><span className="text-4xl drop-shadow-[0_0_10px_rgba(184,134,11,0.5)]">👑</span><h1 className="text-3xl font-display font-black text-[#ffd700] uppercase tracking-widest hidden md:block drop-shadow-md">Возвышение Москвы</h1></div>
                        <div className="text-center font-display flex flex-col items-center">
                            <div className="text-xs text-[#b8860b] uppercase font-bold tracking-[0.3em] mb-1">Текущая Эпоха</div>
                            <div className="text-2xl font-black bg-[#080504] px-6 py-1 border border-[#3d2b1f] text-[#f4e4c1] rounded-sm shadow-inner">Раунд {gameState.round}</div>
                        </div>
                        <button onClick={resetGame} className="text-xs border border-[#3d2b1f] text-[#a07c5a] px-4 py-2 hover:bg-[#3d2b1f] hover:text-[#f4e4c1] uppercase font-condensed font-bold transition-colors rounded-sm tracking-wider">Сбросить Летопись</button>
                    </div>

                    <div className="flex-1 max-w-[1700px] w-full mx-auto grid grid-cols-1 xl:grid-cols-4 gap-8 relative">
                        <div className="xl:col-span-1 space-y-6 order-2 xl:order-1 flex flex-row xl:flex-col overflow-x-auto xl:overflow-visible pb-2">
                            {gameState.teams.slice(0, 2).map((team, idx) => (
                                <div key={team.id} className={`min-w-[280px] flex-1 bg-gradient-to-b from-[#17100b] to-[#110b08] border-2 p-5 rounded-sm transition-all duration-500 relative overflow-hidden ${idx === gameState.currentTurn ? 'border-[#b8860b] shadow-[0_0_30px_rgba(184,134,11,0.15)] scale-105 z-10' : 'border-[#2a1d15]'}`}>
                                    {idx === gameState.currentTurn && <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#ffd700] to-transparent opacity-70"></div>}
                                    <div className="flex items-center gap-3 mb-6 pb-3 border-b border-[#2a1d15]">
                                        <div className={`w-5 h-5 rounded-sm shadow-md ${team.color}`} />
                                        <span className="font-black uppercase text-xl truncate font-serif tracking-wide">{team.name}</span>
                                        {team.jailed > 0 && <span className="ml-auto text-xl" title="В опале">🔒</span>}
                                    </div>
                                    {renderStatBar(team.stats.gold, '💰', 'Казна', '#ffd700')}
                                    {renderStatBar(team.stats.army, '🛡️', 'Дружина', '#dc2626')}
                                    {renderStatBar(team.stats.influence, '👑', 'Влияние', '#a855f7')}
                                    {renderStatBar(team.stats.lands, '🗺️', 'Земли', '#22c55e')}
                                </div>
                            ))}
                        </div>

                        <div className="xl:col-span-2 order-1 xl:order-2 flex justify-center items-center p-2 relative">
                            <div className="relative w-full max-w-[850px] aspect-square bg-[#0c0806] border-[8px] border-[#2a1d15] p-3 shadow-[0_20px_50px_rgba(0,0,0,0.8)] rounded-md">
                                <div className="w-full h-full relative border border-[#3d2b1f] bg-[#110b08]">
                                    <div className="absolute inset-[16%] bg-gradient-to-br from-[#0a0604] to-[#17100b] border-4 border-[#2a1d15] shadow-inner flex flex-col items-center justify-center p-6 rounded-sm">
                                        <div className="z-10 bg-[#110b08]/90 p-8 border border-[#3d2b1f] shadow-2xl w-full max-w-md text-center backdrop-blur-sm relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-1 bg-[#b8860b] opacity-50"></div>
                                            <h3 className="text-[#a07c5a] text-xs font-condensed font-bold tracking-[0.3em] uppercase mb-3">Право хода принадлежит:</h3>
                                            <div className="text-3xl font-black text-[#f4e4c1] uppercase mb-8 flex justify-center items-center gap-4 font-serif drop-shadow-md">
                                                <div className={`w-6 h-6 rounded-sm shadow-lg ${currentTeam?.color}`} />{currentTeam?.name}
                                            </div>
                                            
                                            {gameState.eventStatus === 'idle' && (
                                                <button onClick={rollDice} disabled={!isMyTurn || isRolling} className="w-full py-5 bg-gradient-to-b from-[#b8860b] to-[#8b6508] text-[#080504] font-black text-2xl uppercase tracking-widest shadow-[0_4px_15px_rgba(184,134,11,0.4)] hover:shadow-[0_6px_25px_rgba(184,134,11,0.6)] hover:from-[#daa520] hover:to-[#b8860b] disabled:opacity-40 disabled:hover:shadow-none transition-all font-display rounded-sm border border-[#e6b800]/50">
                                                    {isMyTurn ? 'Бросить кости' : 'Ожидание...'}
                                                </button>
                                            )}
                                            
                                            {isRolling && <div className="text-7xl animate-spin text-[#b8860b] mx-auto mt-6 drop-shadow-[0_0_15px_rgba(184,134,11,0.5)]">🎲</div>}
                                            {diceRoll && gameState.eventStatus === 'rolling' && <div className="text-7xl font-black text-[#ffd700] font-display mt-6 drop-shadow-[0_0_20px_rgba(255,215,0,0.6)] animate-bounce">{diceRoll}</div>}
                                            {gameState.eventStatus === 'generating' && <div className="text-[#b8860b] font-condensed font-bold tracking-widest uppercase animate-pulse mt-8 text-lg">📜 Изучение летописей...</div>}
                                        </div>
                                    </div>
                                    
                                    {TILES.map((tile, i) => {
                                        const pos = getPawnPosition(i, 0); 
                                        let bgColor = 'bg-[#17100b]';
                                        let borderColor = 'border-[#2a1d15]';
                                        if (tile.type === 'crisis') { bgColor = 'bg-red-950/30'; borderColor = 'border-red-900/50'; }
                                        else if (tile.type === 'chance') { bgColor = 'bg-yellow-900/20'; borderColor = 'border-yellow-700/40'; }
                                        else if (['start','rest','opala','go_to_opala'].includes(tile.type)) { bgColor = 'bg-[#1a120d]'; borderColor = 'border-[#b8860b]/40'; }
                                        
                                        let textColor = tile.type === 'crisis' ? 'text-red-500' : tile.type === 'chance' ? 'text-yellow-500' : ['start','rest','opala','go_to_opala'].includes(tile.type) ? 'text-[#ffd700]' : 'text-[#a07c5a]';
                                        
                                        return (
                                            <div key={i} className={`absolute w-[9.09%] h-[9.09%] border-r border-b ${borderColor} ${bgColor} flex flex-col items-center justify-center p-1 hover:bg-[#2a1d15] transition-colors`} style={{ left: pos.left, top: pos.top }}>
                                                <span className={`text-[14px] md:text-2xl mb-1 drop-shadow-md`}>{tile.icon || '📜'}</span>
                                                <span className={`text-[5px] md:text-[8px] font-black uppercase ${textColor} leading-tight text-center font-condensed tracking-wider`}>{tile.label}</span>
                                            </div>
                                        )
                                    })}
                                    
                                    {gameState.teams.map((team, idx) => (
                                        <div key={team.id} className={`absolute w-[5%] h-[5%] md:w-[4%] md:h-[4%] ${team.color} rounded-sm border-2 border-[#ffd700] shadow-[0_0_10px_rgba(0,0,0,0.8)] z-20 transition-all duration-1000 ease-in-out transform hover:scale-125`} style={{ left: getPawnPosition(team.position, idx).left, top: getPawnPosition(team.position, idx).top }} title={team.name}>
                                            <div className="w-full h-full border border-black/50 inset-0 absolute"></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="xl:col-span-1 space-y-6 order-3 flex flex-row xl:flex-col overflow-x-auto xl:overflow-visible pt-2">
                            {gameState.teams.slice(2, 4).map((team, idx) => (
                                <div key={team.id} className={`min-w-[280px] flex-1 bg-gradient-to-b from-[#17100b] to-[#110b08] border-2 p-5 rounded-sm transition-all duration-500 relative overflow-hidden ${idx+2 === gameState.currentTurn ? 'border-[#b8860b] shadow-[0_0_30px_rgba(184,134,11,0.15)] scale-105 z-10' : 'border-[#2a1d15]'}`}>
                                    {idx+2 === gameState.currentTurn && <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#ffd700] to-transparent opacity-70"></div>}
                                    <div className="flex items-center gap-3 mb-6 pb-3 border-b border-[#2a1d15]">
                                        <div className={`w-5 h-5 rounded-sm shadow-md ${team.color}`} />
                                        <span className="font-black uppercase text-xl truncate font-serif tracking-wide">{team.name}</span>
                                        {team.jailed > 0 && <span className="ml-auto text-xl" title="В опале">🔒</span>}
                                    </div>
                                    {renderStatBar(team.stats.gold, '💰', 'Казна', '#ffd700')}
                                    {renderStatBar(team.stats.army, '🛡️', 'Дружина', '#dc2626')}
                                    {renderStatBar(team.stats.influence, '👑', 'Влияние', '#a855f7')}
                                    {renderStatBar(team.stats.lands, '🗺️', 'Земли', '#22c55e')}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* МОДАЛЬНОЕ ОКНО ВОПРОСА / КРИЗИСА С ОТДЕЛЬНЫМ ТАЙМЕРОМ */}
                    {gameState.eventStatus === 'active' && gameState.activeEvent && (
                        <div className={`fixed inset-0 z-50 flex flex-col lg:flex-row items-center justify-center p-2 lg:p-8 transition-all duration-500 ${gameState.activeEvent.type === 'crisis' ? 'crisis-bg backdrop-blur-sm animate-crisis' : 'bg-black/80 backdrop-blur-md'}`}>
                            
                            {/* Главный блок с текстом */}
                            <div className={`max-w-3xl w-full flex flex-col max-h-[85vh] relative overflow-hidden shadow-2xl ${gameState.activeEvent.type === 'crisis' ? 'bg-[#0a0000] border-[4px] lg:border-[8px] border-red-700' : 'bg-[#110b08] border border-[#b8860b] rounded-sm'}`}>
                                
                                {/* Header Модалки */}
                                <div className={`p-4 lg:p-6 text-center shrink-0 relative ${gameState.activeEvent.type === 'crisis' ? 'bg-gradient-to-b from-red-900 to-red-950 border-b-4 border-red-700' : 'bg-[#1a120d] border-b border-[#3d2b1f]'}`}>
                                    <h3 className={`text-2xl lg:text-3xl font-black uppercase tracking-widest font-display drop-shadow-md ${gameState.activeEvent.type === 'crisis' ? 'text-[#ffcccc] tracking-[0.2em]' : 'text-[#ffd700]'}`}>
                                        {gameState.activeEvent.type === 'crisis' ? '⚠️ ИСТОРИЧЕСКИЙ КРИЗИС' : '📜 СТРАНИЦА ЛЕТОПИСИ'}
                                    </h3>
                                    <h4 className={`text-lg lg:text-xl font-bold mt-2 font-condensed tracking-wider ${gameState.activeEvent.type === 'crisis' ? 'text-white uppercase' : 'text-[#b8860b]'}`}>
                                        {gameState.activeEvent.title || gameState.activeEvent.period}
                                    </h4>
                                </div>
                                
                                {/* Прокручиваемое тело окна */}
                                <div className={`p-4 lg:p-8 overflow-y-auto ${gameState.activeEvent.type === 'crisis' ? 'bg-[#0a0000]' : 'bg-[#110b08]'}`}>
                                    <p className={`text-lg lg:text-xl leading-relaxed mb-6 font-serif border-l-4 lg:border-l-8 pl-4 lg:pl-6 ${gameState.activeEvent.type === 'crisis' ? 'text-red-50 border-red-700' : 'text-[#f4e4c1] border-[#b8860b] italic'}`}>
                                        "{gameState.activeEvent.description || gameState.activeEvent.text}"
                                    </p>
                                    
                                    <div className="grid gap-3 lg:gap-5">
                                        {gameState.activeEvent.type === 'question' && gameState.activeEvent.options.map((opt, idx) => (
                                            <button key={idx} onClick={() => submitAnswer(idx)} disabled={!isMyTurn} className="p-3 lg:p-4 bg-[#1a120d] border border-[#3d2b1f] hover:border-[#ffd700] hover:bg-[#2a1d15] hover:shadow-[0_0_15px_rgba(184,134,11,0.2)] text-left text-base lg:text-lg font-bold text-[#f4e4c1] disabled:opacity-50 transition-all rounded-sm font-condensed tracking-wide">
                                                <span className="text-[#b8860b] mr-2 lg:mr-3">{idx + 1}.</span> {opt}
                                            </button>
                                        ))}
                                        
                                        {gameState.activeEvent.type === 'crisis' && gameState.activeEvent.options.map((opt, idx) => (
                                            <button key={idx} onClick={() => submitCrisisChoice(idx)} disabled={!isMyTurn} className="relative overflow-hidden group p-4 lg:p-5 bg-[#1a0000] border-2 border-red-900 hover:border-red-500 hover:bg-red-950 text-left disabled:opacity-50 transition-all shadow-lg">
                                                <div className="absolute inset-0 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,rgba(220,38,38,0.03)_10px,rgba(220,38,38,0.03)_20px)] pointer-events-none"></div>
                                                <span className="block text-lg lg:text-xl font-black text-white mb-1 lg:mb-2 uppercase font-display tracking-widest relative z-10 group-hover:text-[#ffcccc]">{opt.text}</span>
                                                <span className="block text-sm lg:text-base text-red-400 uppercase font-bold font-condensed tracking-widest relative z-10">Цена решения: {opt.risk}</span>
                                            </button>
                                        ))}
                                    </div>
                                    {!isMyTurn && <p className={`text-center mt-6 uppercase font-bold text-sm lg:text-base tracking-[0.2em] animate-pulse ${gameState.activeEvent.type === 'crisis' ? 'text-red-500' : 'text-[#b8860b]'}`}>Ожидание решения правящего князя...</p>}
                                </div>
                            </div>

                            {/* ОГРОМНЫЙ ТАЙМЕР СБОКУ */}
                            <div className="mt-4 lg:mt-0 lg:ml-12 flex flex-col items-center justify-center shrink-0">
                                <div className={`flex flex-row lg:flex-col items-center justify-center gap-4 lg:gap-0 p-4 lg:p-8 rounded-2xl bg-[#080504]/90 border-2 ${timeLeft <= 10 ? 'border-red-700 shadow-[0_0_40px_rgba(239,68,68,0.4)]' : 'border-[#b8860b] shadow-[0_0_30px_rgba(184,134,11,0.2)]'} backdrop-blur-md`}>
                                    <span className={`text-4xl lg:text-6xl ${timeLeft <= 10 ? 'text-red-500 animate-pulse drop-shadow-[0_0_20px_rgba(239,68,68,0.8)]' : 'text-[#b8860b] drop-shadow-[0_0_15px_rgba(184,134,11,0.5)]'} lg:mb-2`}>⏱️</span>
                                    <span className={`font-mono text-5xl lg:text-8xl font-black tracking-widest drop-shadow-2xl ${timeLeft <= 10 ? 'text-red-500' : 'text-[#ffd700]'}`}>{timeLeft}</span>
                                </div>
                            </div>

                        </div>
                    )}

                    {/* МОДАЛЬНОЕ ОКНО ИСХОДА */}
                    {gameState.eventStatus === 'outcome' && gameState.activeEvent && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="max-w-2xl w-full bg-[#110b08] border-2 border-[#b8860b] shadow-[0_0_50px_rgba(184,134,11,0.2)] rounded-sm overflow-hidden max-h-[90vh] flex flex-col">
                                <div className="p-6 lg:p-8 text-center border-b border-[#3d2b1f] bg-[#1a120d] shrink-0">
                                    <h3 className="text-2xl lg:text-3xl font-black uppercase text-[#ffd700] font-display tracking-widest">{gameState.activeEvent.title}</h3>
                                </div>
                                <div className="p-6 lg:p-10 overflow-y-auto">
                                    <p className="text-lg lg:text-xl text-[#f4e4c1] mb-8 lg:mb-10 font-serif leading-relaxed text-center">{gameState.activeEvent.message || gameState.activeEvent.story}</p>
                                    
                                    {gameState.activeEvent.deltas && (
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 lg:mb-10">
                                            {[ { key: 'gold', label: 'КАЗНА', icon: '💰' }, { key: 'army', label: 'ДРУЖИНА', icon: '🛡️' }, { key: 'influence', label: 'ВЛИЯНИЕ', icon: '👑' }, { key: 'lands', label: 'ЗЕМЛИ', icon: '🗺️' } ].map(stat => {
                                                const val = gameState.activeEvent.deltas[stat.key];
                                                if (val === undefined || val === null) return null;
                                                const isPositive = val > 0;
                                                const isZero = val === 0;
                                                return (
                                                    <div key={stat.key} className="bg-[#080504] p-3 lg:p-4 border border-[#3d2b1f] text-center rounded-sm shadow-inner relative overflow-hidden">
                                                        <div className="text-2xl lg:text-3xl mb-2 lg:mb-3 drop-shadow-md">{stat.icon}</div>
                                                        <div className="text-[10px] lg:text-xs text-[#a07c5a] uppercase font-bold font-condensed tracking-widest mb-1">{stat.label}</div>
                                                        <div className={`text-xl lg:text-2xl font-black font-serif ${isPositive ? 'text-green-500 drop-shadow-[0_0_5px_rgba(34,197,94,0.5)]' : isZero ? 'text-[#f4e4c1]' : 'text-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.5)]'}`}>
                                                            {isPositive ? '+' : ''}{val}
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    )}
                                    {isMyTurn ? (
                                        <button onClick={completeTurn} className="w-full bg-gradient-to-r from-[#b8860b] to-[#daa520] hover:from-[#daa520] hover:to-[#b8860b] text-[#080504] py-4 lg:py-5 font-black uppercase tracking-[0.2em] text-lg lg:text-xl font-display transition-all shadow-[0_0_15px_rgba(184,134,11,0.4)] rounded-sm">Продолжить Путь</button>
                                    ) : (
                                        <p className="text-center text-[#a07c5a] uppercase font-bold tracking-widest font-condensed">Ожидание активного игрока...</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
