<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Монополия: Возвышение Москвы</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500&display=swap');

        body { 
            font-family: 'Roboto', sans-serif; 
            background: #0c0806;
            color: #f4e4c1; 
            display: flex; 
            margin: 0; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .sidebar { 
            width: 340px; 
            background: #17100b; 
            padding: 20px; 
            border-right: 3px solid #b8860b; 
            overflow-y: auto; 
            box-shadow: 10px 0 30px rgba(0,0,0,0.9);
            z-index: 20;
        }
        
        .sidebar h2 { font-family: 'Cinzel', serif; text-transform: uppercase; color: #ffd700; text-align: center; letter-spacing: 2px; margin-bottom: 25px; }
        
        .dashboard { 
            background: linear-gradient(135deg, #241811, #130d0a); 
            border: 1px solid #b8860b; 
            border-radius: 10px; 
            padding: 15px; 
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            position: relative;
        }
        .dashboard h3 { margin: 0 0 10px 0; font-family: 'Cinzel', serif; color: #ffd700; font-size: 16px; border-bottom: 1px solid rgba(184,134,11,0.3); padding-bottom: 6px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }

        .main-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle at center, #211610 0%, #080504 100%); }
        
        .board { 
            width: 720px; 
            height: 720px; 
            border: 5px solid #8b6508; 
            border-radius: 12px;
            display: grid; 
            grid-template-columns: repeat(11, 1fr); 
            grid-template-rows: repeat(11, 1fr); 
            background: #120c08; 
            box-shadow: 0 0 60px rgba(0,0,0,0.9); 
            position: relative; 
        }
        
        .cell { 
            border: 1px solid rgba(184, 134, 11, 0.2); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            text-align: center; 
            font-weight: 500;
            color: #dcd0c0;
            position: relative; 
        }
        
        .cell-glow { background: rgba(255, 215, 0, 0.15) !important; border-color: #ffd700 !important; }

        .pawn { 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            position: absolute; 
            border: 2px solid #fff; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: all 0.5s ease-in-out;
            z-index: 10; 
        }

        .center-controls { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            text-align: center; 
            background: rgba(18, 12, 9, 0.95); 
            padding: 35px; 
            border-radius: 15px; 
            border: 2px solid #b8860b; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            z-index: 15;
        }
        
        button { 
            background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            color: #120c08; 
            border: none; 
            padding: 12px 28px; 
            font-size: 15px; 
            font-family: 'Cinzel', serif;
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 6px; 
            margin-top: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }

        input {
            padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #b8860b;
            background: #0c0806; color: #fff; outline: none; text-align: center; font-family: 'Roboto', sans-serif;
        }

        .modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: #1a120c; 
            border: 2px solid #ffd700; padding: 35px; border-radius: 12px; z-index: 100; 
            width: 90%; max-width: 550px; text-align: center; 
            box-shadow: 0 0 50px rgba(0,0,0,0.9); 
        }
        .modal.active { display: block; }
        
        .modal h2 { font-family: 'Cinzel', serif; font-size: 24px; color: #ffd700; margin-top: 0; }
        
        .timer { font-size: 28px; color: #ff6b6b; font-weight: bold; margin: 15px 0; font-family: 'Cinzel', serif; }
        
        .option-btn { 
            display: block; width: 100%; margin: 10px 0; 
            background: #271b13; 
            color: #f4e4c1; border: 1px solid #b8860b; 
            padding: 14px; text-align: left; font-size: 14px; border-radius: 6px;
            cursor: pointer; transition: background 0.2s;
        }
        .option-btn:hover:not(:disabled) { background: #3d291d; border-color: #ffd700; }
        
        .delta-badge {
            display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; margin-top: 10px;
        }
        .delta-pos { background: rgba(0, 128, 0, 0.3); color: #90ee90; border: 1px solid #008000; }
        .delta-neg { background: rgba(128, 0, 0, 0.3); color: #ff6b6b; border: 1px solid #8b0000; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99; }
    </style>
</head>
<body>

<div class="sidebar" id="dashboards">
    <h2>Летопись Думы</h2>
</div>

<div class="main-area">
    <div class="board" id="board"></div>
    
    <div class="center-controls">
        <div id="setup-screen">
            <h2 style="font-family:'Cinzel', serif; color:#ffd700; margin-top:0;">Начало Эпохи</h2>
            <input type="text" id="teamName" placeholder="Название княжества">
            <br>
            <button onclick="joinGame()">Вступить в борьбу</button>
        </div>
        <div id="game-controls" style="display:none;">
            <h2 id="turn-indicator" style="font-family:'Cinzel', serif; color:#f4e4c1; font-size: 18px;">Ожидание хода...</h2>
            <button id="rollBtn" onclick="rollDice()" disabled>Бросить кости</button>
        </div>
    </div>
</div>

<div id="overlay"></div>
<div class="modal" id="eventModal">
    <h2 id="eventTitle">Событие</h2>
    <p id="eventText" style="font-size: 16px; line-height: 1.5;"></p>
    <div class="timer" id="timerDisplay">30</div>
    <div id="optionsContainer"></div>
    <div id="resultArea"></div>
    <button id="nextBtn" style="display:none; width: 100%;" onclick="closeEvent()">Продолжить путь</button>
</div>

<script>
    const socket = io('https://moscow-game.onrender.com');
    let myId = null;
    let timerInterval = null;
    let currentEvent = null;

    const board = document.getElementById('board');
    const cellPositions = []; 
    
    for(let i=0; i<11; i++) { cellPositions.push({col: i+1, row: 1}); } 
    for(let i=1; i<11; i++) { cellPositions.push({col: 11, row: i+1}); } 
    for(let i=9; i>=0; i--) { cellPositions.push({col: i+1, row: 11}); } 
    for(let i=9; i>=1; i--) { cellPositions.push({col: 1, row: i+1}); } 

    cellPositions.forEach((pos, index) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'cell-' + index;
        cell.style.gridColumn = pos.col;
        cell.style.gridRow = pos.row;
        
        if(index === 0) { cell.innerHTML = "<b>МОСКВА</b>"; cell.style.background = "#2b2015"; } 
        else if (index % 5 === 0) { cell.innerText = "КРИЗИС"; cell.style.background = "#261010"; } 
        else if (index % 7 === 0) { cell.innerText = "ШАНС"; cell.style.background = "#102610"; } 
        else { cell.innerText = index; }
        
        board.appendChild(cell);
    });

    socket.on('connect', () => { myId = socket.id; });

    function joinGame() {
        const name = document.getElementById('teamName').value;
        if(name) {
            socket.emit('join_game', {team_name: name});
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-controls').style.display = 'block';
        }
    }

    function rollDice() {
        socket.emit('roll_dice');
        document.getElementById('rollBtn').disabled = true;
    }

    socket.on('update_state', (state) => {
        const dashboards = document.getElementById('dashboards');
        dashboards.innerHTML = '<h2>Летопись Думы</h2>';
        
        document.querySelectorAll('.pawn').forEach(p => p.remove());
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('cell-glow'));

        let i = 0;
        for (const [id, player] of Object.entries(state.players)) {
            const initial = player.name ? player.name.charAt(0).toUpperCase() : 'К';
            const pos = cellPositions[player.position];
            
            const activeCell = document.getElementById('cell-' + player.position);
            if(activeCell) activeCell.classList.add('cell-glow');

            const pawn = document.createElement('div');
            pawn.className = 'pawn';
            pawn.style.backgroundColor = player.color; 
            pawn.innerText = initial;
            pawn.style.left = `calc(${(pos.col - 1) * (100/11)}% + 10px + ${i*10}px)`;
            pawn.style.top = `calc(${(pos.row - 1) * (100/11)}% + 10px)`;
            board.appendChild(pawn);

            dashboards.innerHTML += `
                <div class="dashboard" style="border-left: 5px solid ${player.color}">
                    <h3>${player.name}</h3>
                    <div class="stat-row"><span>Казна:</span> <span style="color:#ffd700">${player.stats.gold}</span></div>
                    <div class="stat-row"><span>Дружина:</span> <span style="color:#ff6b6b">${player.stats.army}</span></div>
                    <div class="stat-row"><span>Влияние:</span> <span style="color:#dda0dd">${player.stats.influence}</span></div>
                    <div class="stat-row"><span>Земли:</span> <span style="color:#90ee90">${player.stats.lands}</span></div>
                </div>
            `;
            i++;
        }

        if (state.player_order.length > 0) {
            const currentPlayerId = state.player_order[state.turn_index];
            const isMyTurn = (currentPlayerId === myId);
            const currentName = state.players[currentPlayerId].name;
            
            document.getElementById('turn-indicator').innerHTML = isMyTurn ? "<span style='color:#ffd700'>ВАШ ХОД!</span>" : `Ходит: ${currentName}`;
            document.getElementById('rollBtn').disabled = !isMyTurn;
        }
    });

    socket.on('trigger_event', (data) => {
        if (data.player_id === myId) {
            try {
                currentEvent = typeof data.event === 'string' ? JSON.parse(data.event) : data.event;
                showEventModal(currentEvent);
            } catch(e) { console.error("Ошибка парсинга:", e); socket.emit('end_turn'); }
        }
    });

    function showEventModal(event) {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('eventModal').classList.add('active');
        
        document.getElementById('eventTitle.innerText') = event.type === 'кризис' ? "🔥 ИСТОРИЧЕСКИЙ КРИЗИС" : "📜 ВЫБОР ЭПОХИ";
        document.getElementById('eventText').innerText = event.text;
        document.getElementById('resultArea').innerHTML = "";
        document.getElementById('nextBtn').style.display = 'none';
        
        const container = document.getElementById('optionsContainer');
        container.innerHTML = "";
        
        event.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(index);
            container.appendChild(btn);
        });

        let timeLeft = 30;
        document.getElementById('timerDisplay').innerText = timeLeft;
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleAnswer(0); 
            }
        }, 1000);
    }

    function handleAnswer(selectedIndex) {
        clearInterval(timerInterval);
        const container = document.getElementById('optionsContainer');
        container.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

        const delta = currentEvent.delta || {"gold": 10, "influence": 5};
        socket.emit('submit_answer', {delta: delta});

        let deltaHtml = Object.entries(delta).map(([k, v]) => {
            let label = k === 'gold' ? 'Казна' : k === 'army' ? 'Дружина' : k === 'influence' ? 'Влияние' : 'Земли';
            let sign = v > 0 ? `+${v}` : v;
            let cls = v >= 0 ? 'delta-pos' : 'delta-neg';
            return `<span class="delta-badge ${cls}">${label}: ${sign}</span>`;
        }).join(' ');

        document.getElementById('resultArea').innerHTML = `
            <p style="margin-top:15px; color:#f4e4c1; font-size:14px;">${currentEvent.explanation}</p>
            <div>${deltaHtml}</div>
        `;
        document.getElementById('nextBtn').style.display = 'block';
    }

    function closeEvent() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('eventModal').classList.remove('active');
        socket.emit('end_turn'); 
    }
</script>
</body>
</html>
