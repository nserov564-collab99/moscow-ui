        const generateTiles = () => {
            const tiles = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                if (i === 0) tiles.push({ type: 'start', label: 'МОСКВА', icon: '🏰' });
                else if (i === 10) tiles.push({ type: 'opala', label: 'ОПАЛА', icon: '🔒' });
                else if (i === 20) tiles.push({ type: 'rest', label: 'ПИР', icon: '🏆' });
                else if (i === 30) tiles.push({ type: 'go_to_opala', label: 'СУД ХАНА', icon: '🛑' });
                else if ([5, 15, 25, 35].includes(i)) tiles.push({ type: 'crisis', label: 'КРИЗИС', icon: '🔥' });
                else if ([7, 12, 22, 28, 38].includes(i)) tiles.push({ type: 'chance', label: 'ШАНС', icon: '🍀' });
                else {
                    let period = 'Конец XIII века (Даниил Александрович)';
                    if (i > 5 && i < 15) period = 'Первая половина XIV века (Иван Калита)';
                    else if (i > 15 && i < 25) period = 'Вторая половина XIV века (Дмитрий Донской)';
                    else if (i > 25 && i < 35) period = 'XV век (Василий II Темный)';
                    else if (i > 35) period = 'Конец XV - начало XVI века (Иван III)';
                    tiles.push({ type: 'question', label: 'ЛЕТОПИСЬ', period });
                }
            }
            return tiles;
        };
        const TILES = generateTiles();

        function App() {
            const [user, setUser] = useState(null);
            const [localUserId, setLocalUserId] = useState(null);
            const [gameState, setGameState] = useState(null);
            const [newTeamName, setNewTeamName] = useState('');
            const [timeLeft, setTimeLeft] = useState(0);
            const [isRolling, setIsRolling] = useState(false);
            const [diceRoll, setDiceRoll] = useState(null);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                const unsubscribe = auth.onAuthStateChanged(u => {
                    setUser(u);
                    if (u) setLocalUserId(u.uid);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const gameRef = db.collection('games').doc(ROOM_ID);
                
                gameRef.get().then(docSnap => {
                    if (!docSnap.exists) {
                        gameRef.set({ status: 'setup', teams: [], currentTurn: 0, round: 1, eventStatus: 'idle', activeEvent: null });
                    }
                });

                const unsubscribe = gameRef.onSnapshot((docSnap) => {
                    if (docSnap.exists) setGameState(docSnap.data());
                }, console.error);
                
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                if (!gameState || gameState.eventStatus !== 'active' || !gameState.activeEvent?.expiresAt) {
                    setTimeLeft(0);
                    return;
                }
                const interval = setInterval(() => {
                    const remaining = Math.max(0, Math.floor((gameState.activeEvent.expiresAt - Date.now()) / 1000));
                    setTimeLeft(remaining);
                    if (remaining === 0) {
                        clearInterval(interval);
                        const currentTeam = gameState.teams[gameState.currentTurn];
                        if (currentTeam && currentTeam.ownerId === localUserId) handleTimeout();
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [gameState?.eventStatus, gameState?.activeEvent?.expiresAt, localUserId]);

            const updateGame = async (updates) => {
                await db.collection('games').doc(ROOM_ID).set(updates, { merge: true });
            };

            const addTeam = async () => {
                if (!newTeamName.trim() || !gameState || gameState.teams.length >= 4) return;
                const newTeam = {
                    id: Date.now().toString(), ownerId: localUserId, name: newTeamName.trim(), position: 0,
                    color: TEAM_COLORS[gameState.teams.length], stats: { ...INITIAL_STATS }, jailed: 0
                };
                await updateGame({ teams: [...gameState.teams, newTeam] });
                setNewTeamName('');
            };

            const startGame = () => updateGame({ status: 'playing', currentTurn: 0, round: 1, eventStatus: 'idle' });
            const resetGame = () => updateGame({ status: 'setup', teams: [], currentTurn: 0, round: 1, eventStatus: 'idle', activeEvent: null });

            const rollDice = async () => {
                if (gameState.eventStatus !== 'idle') return;
                setIsRolling(true);
                await updateGame({ eventStatus: 'rolling' });
                
                setTimeout(async () => {
                    const roll = Math.floor(Math.random() * 6) + 1;
                    setDiceRoll(roll);
                    setIsRolling(false);
                    
                    const teams = [...gameState.teams];
                    const team = teams[gameState.currentTurn];
                    
                    if (team.jailed > 0) {
                        team.jailed -= 1;
                        await updateGame({ teams, eventStatus: 'outcome', activeEvent: { type: 'info', title: 'ОПАЛА', message: `Князь в ставке Хана. Осталось пропустить ходов: ${team.jailed}` }});
                        return;
                    }

                    team.position = (team.position + roll) % BOARD_SIZE;
                    
                    if (team.position === 30) {
                        team.position = 10; team.jailed = 2; 
                        await updateGame({ teams, eventStatus: 'outcome', activeEvent: { type: 'info', title: 'ВЫЗОВ К ХАНУ!', message: 'Гнев Орды. Вы отправляетесь в ставку хана и пропускаете 2 хода.' }});
                        return;
                    }

                    await updateGame({ teams, eventStatus: 'generating' });
                    triggerTileEvent(team, team.position);
                }, 1000);
            };

            const triggerTileEvent = async (team, position) => {
                const tile = TILES[position];
                if (tile.type === 'start' || tile.type === 'rest' || tile.type === 'opala') {
                    await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'info', title: tile.label, message: 'Княжество переводит дух. Ничего не происходит.' }});
                    return;
                }

                if (tile.type === 'chance') {
                    const chanceList = LOCAL_CHANCES;
                    const randomChance = chanceList[Math.floor(Math.random() * chanceList.length)];
                    await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'chance', ...randomChance } });
                    return;
                }

                if (tile.type === 'crisis') {
                    const crisisList = LOCAL_CRISES;
                    const randomCrisis = crisisList[Math.floor(Math.random() * crisisList.length)];
                    await updateGame({ eventStatus: 'active', activeEvent: { type: 'crisis', ...randomCrisis, expiresAt: Date.now() + 45000 } });
                    return;
                }

                if (tile.type === 'question') {
                    const periodQuestions = LOCAL_QUESTIONS[tile.period] || LOCAL_QUESTIONS['Конец XIII века (Даниил Александрович)'];
                    const randomQuestion = periodQuestions[Math.floor(Math.random() * periodQuestions.length)];
                    await updateGame({ eventStatus: 'active', activeEvent: { type: 'question', ...randomQuestion, expiresAt: Date.now() + 45000 } });
                    return;
                }
            };

            const handleTimeout = async () => {
                const { type } = gameState.activeEvent;
                await updateGame({ eventStatus: 'generating' }); 
                let outcomeData = type === 'question' ? {
                    title: 'Время вышло!', story: `Боярская дума не дала ответа. Правильный ответ: ${gameState.activeEvent.options[gameState.activeEvent.correctIndex]}. ${gameState.activeEvent.explanation}`,
                    deltas: { gold: -5, army: -5, influence: -10, lands: 0 }
                } : { title: 'Нерешительность!', story: 'Князь не принял решение. Кризис ударил в полную силу.', deltas: { gold: -15, army: -15, influence: -20, lands: -1 } };
                await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'outcome', ...outcomeData } });
            };

            const submitAnswer = async (idx) => {
                const ev = gameState.activeEvent;
                const isCorrect = idx === ev.correctIndex;
                await updateGame({ eventStatus: 'generating' });
                const storyText = isCorrect ? `Верно! ${ev.explanation}` : `Неверно. Правильный ответ: ${ev.options[ev.correctIndex]}. ${ev.explanation}`;
                const deltas = isCorrect ? { gold: 10, army: 0, influence: 10, lands: 0 } : { gold: -5, army: 0, influence: -10, lands: 0 };
                await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'outcome', title: isCorrect ? 'Истина!' : 'Заблуждение!', story: storyText, deltas } });
            };

            const submitCrisisChoice = async (idx) => {
                const ev = gameState.activeEvent;
                const choice = ev.options[idx];
                await updateGame({ eventStatus: 'generating' });
                const storyText = `Решение исполнено: "${choice.text}". Последствия риска: ${choice.risk}.`;
                const deltas = idx === 0 ? { gold: -15, army: 0, influence: 5, lands: 0 } : { gold: 0, army: -10, influence: 10, lands: 0 };
                await updateGame({ eventStatus: 'outcome', activeEvent: { type: 'outcome', title: 'Последствия кризиса', story: storyText, deltas } });
            };

            const completeTurn = async () => {
                const ev = gameState.activeEvent;
                const newTeams = [...gameState.teams];
                const team = newTeams[gameState.currentTurn];
                if (ev?.deltas) {
                    team.stats.gold = Math.max(0, team.stats.gold + (ev.deltas.gold || 0));
                    team.stats.army = Math.max(0, team.stats.army + (ev.deltas.army || 0));
                    team.stats.influence = Math.max(0, team.stats.influence + (ev.deltas.influence || 0));
                    team.stats.lands = Math.max(0, team.stats.lands + (ev.deltas.lands || 0));
                }
                const nextTurn = (gameState.currentTurn + 1) % gameState.teams.length;
                await updateGame({ teams: newTeams, currentTurn: nextTurn, round: nextTurn === 0 ? gameState.round + 1 : gameState.round, eventStatus: 'idle', activeEvent: null });
                setDiceRoll(null);
            };

            const getPawnPosition = (index, teamIndex) => {
                let x = 0, y = 0; const cellSize = 100 / 11; 
                if (index <= 10) { x = index * cellSize; y = 0; }
                else if (index <= 20) { x = 100 - cellSize; y = (index - 10) * cellSize; }
                else if (index <= 30) { x = (30 - index) * cellSize; y = 100 - cellSize; }
                else { x = 0; y = (40 - index) * cellSize; }
                const offset = [ {dx: 1, dy: 1}, {dx: 3, dy: 1}, {dx: 1, dy: 3}, {dx: 3, dy: 3} ][teamIndex % 4];
                return { left: `calc(${x}% + ${offset.dx}%)`, top: `calc(${y}% + ${offset.dy}%)` };
            };

            if (!user || !gameState) return <div className="min-h-screen flex items-center justify-center"><p className="text-xl font-bold animate-pulse text-[#b8860b]">⏳ Призыв летописцев...</p></div>;

            if (gameState.status === 'setup') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 font-serif text-[#f4e4c1]">
                        <div className="max-w-md w-full bg-[#17100b] border-2 border-[#b8860b] p-8 shadow-2xl">
                            <div className="text-center text-5xl mb-4">👑</div>
                            <h1 className="text-3xl font-black text-center mb-2 text-[#ffd700] tracking-widest">ВОЗВЫШЕНИЕ МОСКВЫ</h1>
                            <h2 className="text-sm font-bold text-center mb-8 tracking-widest border-b border-[#b8860b] pb-2">Летопись княжеств</h2>
                            <div className="space-y-4 mb-8">
                                <div className="flex gap-2">
                                    <input type="text" value={newTeamName} onChange={e=>setNewTeamName(e.target.value)} placeholder="Название Княжества" className="flex-1 bg-[#0c0806] border border-[#b8860b] px-4 py-2 outline-none focus:border-[#ffd700] uppercase font-bold" />
                                    <button onClick={addTeam} disabled={!newTeamName.trim() || gameState.teams.length >= 4} className="bg-[#b8860b] hover:bg-[#daa520] px-4 py-2 text-[#0c0806] font-bold disabled:opacity-50 uppercase">Вступить</button>
                                </div>
                                <div className="space-y-2">
                                    {gameState.teams.map(t => (
                                        <div key={t.id} className="flex items-center gap-3 bg-[#1f150f] p-3 border-l-4" style={{ borderColor: t.color.replace('bg-','') }}>
                                            <div className={`w-4 h-4 ${t.color}`} /> <span className="font-bold uppercase tracking-wider">{t.name}</span>
                                            {t.ownerId === localUserId && <span className="ml-auto text-xs text-[#ffd700]">(ВЫ)</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <button onClick={startGame} disabled={gameState.teams.length < 2} className="w-full bg-gradient-to-r from-[#b8860b] to-[#daa520] text-[#0c0806] py-4 font-black uppercase tracking-widest disabled:opacity-50 shadow-lg">▶️ Начать эпоху</button>
                        </div>
                    </div>
                );
            }

            const currentTeam = gameState.teams[gameState.currentTurn];
            const isMyTurn = currentTeam?.ownerId === localUserId;

            const renderStatBar = (value, icon, label, colorHex) => (
                <div className="mb-3">
                    <div className="flex justify-between items-end mb-1">
                        <div className="flex items-center gap-2 text-xs uppercase font-bold text-[#b8860b]">{icon} {label}</div>
                        <div className="text-sm font-black text-[#f4e4c1]">{value}</div>
                    </div>
                    <div className="w-full h-2 bg-[#0c0806] border border-[#3d2b1f]"><div className="h-full transition-all duration-700" style={{ width: `${Math.min(100, value)}%`, backgroundColor: colorHex }} /></div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col p-2 lg:p-6 text-[#f4e4c1]">
                    <div className="flex justify-between items-center mb-4 bg-[#17100b] p-4 border-b-2 border-[#b8860b] shadow-lg">
                        <div className="flex items-center gap-4"><span className="text-3xl">👑</span><h1 className="text-2xl font-black text-[#ffd700] uppercase tracking-widest hidden md:block font-serif">Возвышение Москвы</h1></div>
                        <div className="text-center font-serif"><div className="text-xs text-[#b8860b] uppercase font-bold tracking-widest">Эпоха</div><div className="text-xl font-black">Раунд {gameState.round}</div></div>
                        <button onClick={resetGame} className="text-xs border border-[#b8860b] text-[#b8860b] px-3 py-1 hover:bg-[#b8860b] hover:text-[#0c0806] uppercase font-bold">Сброс Игры</button>
                    </div>

                    <div className="flex-1 max-w-[1600px] w-full mx-auto grid grid-cols-1 xl:grid-cols-4 gap-6 relative">
                        <div className="xl:col-span-1 space-y-4 order-2 xl:order-1 flex flex-row xl:flex-col overflow-x-auto xl:overflow-visible pb-2">
                            {gameState.teams.slice(0, 2).map((team, idx) => (
                                <div key={team.id} className={`min-w-[250px] flex-1 bg-[#17100b] border-2 p-4 transition-all ${idx === gameState.currentTurn ? 'border-[#ffd700] shadow-[0_0_15px_rgba(255,215,0,0.2)] scale-105 z-10' : 'border-[#3d2b1f]'}`}>
                                    <div className="flex items-center gap-3 mb-4 pb-2 border-b border-[#3d2b1f]">
                                        <div className={`w-4 h-4 ${team.color}`} /><span className="font-black uppercase text-lg truncate font-serif">{team.name}</span>
                                        {team.jailed > 0 && <span className="ml-auto">🔒</span>}
                                    </div>
                                    {renderStatBar(team.stats.gold, '💰', 'Казна', '#ffd700')}
                                    {renderStatBar(team.stats.army, '🛡️', 'Дружина', '#dc2626')}
                                    {renderStatBar(team.stats.influence, '👑', 'Влияние', '#a855f7')}
                                    {renderStatBar(team.stats.lands, '🗺️', 'Земли', '#22c55e')}
                                </div>
                            ))}
                        </div>

                        <div className="xl:col-span-2 order-1 xl:order-2 flex justify-center items-center p-2">
                            <div className="relative w-full max-w-[800px] aspect-square bg-[#17100b] border-[6px] border-[#b8860b] p-4 shadow-2xl">
                                <div className="w-full h-full relative border border-[#3d2b1f]">
                                    <div className="absolute inset-[15%] bg-[#0c0806] border-2 border-[#3d2b1f] flex flex-col items-center justify-center p-4">
                                        <div className="z-10 bg-[#17100b]/95 p-6 border border-[#b8860b] shadow-2xl w-full max-w-sm text-center">
                                            <h3 className="text-[#b8860b] text-sm font-bold uppercase mb-1 font-serif">Очередь княжить:</h3>
                                            <div className="text-2xl font-black text-[#f4e4c1] uppercase mb-6 flex justify-center items-center gap-3 font-serif">
                                                <div className={`w-4 h-4 ${currentTeam?.color}`} />{currentTeam?.name}
                                            </div>
                                            {gameState.eventStatus === 'idle' && (
                                                <button onClick={rollDice} disabled={!isMyTurn || isRolling} className="w-full py-4 bg-gradient-to-b from-[#b8860b] to-[#8b6508] text-[#0c0806] font-black text-xl uppercase shadow-lg disabled:opacity-50 font-serif">
                                                    {isMyTurn ? 'Бросить кости' : 'Ожидание хода...'}
                                                </button>
                                            )}
                                            {isRolling && <div className="text-5xl animate-spin text-[#b8860b] mx-auto mt-4">🎲</div>}
                                            {diceRoll && gameState.eventStatus === 'rolling' && <div className="text-5xl font-black text-[#ffd700] font-serif mt-4">{diceRoll}</div>}
                                            {gameState.eventStatus === 'generating' && <div className="text-[#ffd700] font-bold uppercase animate-pulse mt-4">📜 Летописец пишет...</div>}
                                        </div>
                                    </div>
                                    {TILES.map((tile, i) => {
                                        const pos = getPawnPosition(i, 0); 
                                        let bgColor = tile.type === 'crisis' ? 'bg-red-950/40' : tile.type === 'chance' ? 'bg-yellow-950/30' : ['start','rest','opala','go_to_opala'].includes(tile.type) ? 'bg-[#2a1d15]' : 'bg-[#1f150f]';
                                        let textColor = tile.type === 'crisis' ? 'text-red-400' : tile.type === 'chance' ? 'text-yellow-500' : ['start','rest','opala','go_to_opala'].includes(tile.type) ? 'text-[#ffd700]' : 'text-[#b8860b]';
                                        return (
                                            <div key={i} className={`absolute w-[9.09%] h-[9.09%] border border-[#3d2b1f] ${bgColor} flex flex-col items-center justify-center p-1`} style={{ left: pos.left, top: pos.top }}>
                                                <span className={`text-[12px] md:text-xl mb-1 opacity-80`}>{tile.icon || '📜'}</span>
                                                <span className={`text-[6px] md:text-[8px] font-black uppercase ${textColor} leading-tight text-center`}>{tile.label}</span>
                                            </div>
                                        )
                                    })}
                                    {gameState.teams.map((team, idx) => (
                                        <div key={team.id} className={`absolute w-[4%] h-[4%] md:w-[3%] md:h-[3%] ${team.color} rounded-full border-2 border-[#ffd700] shadow-lg z-20 transition-all duration-1000`} style={{ left: getPawnPosition(team.position, idx).left, top: getPawnPosition(team.position, idx).top }} title={team.name} />
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="xl:col-span-1 space-y-4 order-3 flex flex-row xl:flex-col overflow-x-auto xl:overflow-visible pt-2">
                            {gameState.teams.slice(2, 4).map((team, idx) => (
                                <div key={team.id} className={`min-w-[250px] flex-1 bg-[#17100b] border-2 p-4 transition-all ${idx+2 === gameState.currentTurn ? 'border-[#ffd700] shadow-[0_0_15px_rgba(255,215,0,0.2)] scale-105 z-10' : 'border-[#3d2b1f]'}`}>
                                    <div className="flex items-center gap-3 mb-4 pb-2 border-b border-[#3d2b1f]">
                                        <div className={`w-4 h-4 ${team.color}`} /><span className="font-black uppercase text-lg truncate font-serif">{team.name}</span>
                                        {team.jailed > 0 && <span className="ml-auto">🔒</span>}
                                    </div>
                                    {renderStatBar(team.stats.gold, '💰', 'Казна', '#ffd700')}
                                    {renderStatBar(team.stats.army, '🛡️', 'Дружина', '#dc2626')}
                                    {renderStatBar(team.stats.influence, '👑', 'Влияние', '#a855f7')}
                                    {renderStatBar(team.stats.lands, '🗺️', 'Земли', '#22c55e')}
                                </div>
                            ))}
                        </div>
                    </div>

                    {gameState.eventStatus === 'active' && gameState.activeEvent && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className={`max-w-2xl w-full border-4 ${gameState.activeEvent.type === 'crisis' ? 'border-red-800' : 'border-[#b8860b]'} bg-[#17100b]`}>
                                <div className={`p-6 text-center relative ${gameState.activeEvent.type === 'crisis' ? 'bg-red-950' : 'bg-[#1f150f]'}`}>
                                    <h3 className={`text-2xl font-black uppercase font-serif ${gameState.activeEvent.type === 'crisis' ? 'text-red-400' : 'text-[#ffd700]'}`}>
                                        {gameState.activeEvent.type === 'crisis' ? gameState.activeEvent.title : 'ВОПРОС ЛЕТОПИСИ'}
                                    </h3>
                                    <div className="absolute top-1/2 -translate-y-1/2 right-4 bg-[#0c0806] px-4 py-2 border border-[#b8860b] flex gap-2">
                                        <span className={timeLeft <= 10 ? 'text-red-500 animate-bounce' : 'text-[#b8860b]'}>⏱️</span>
                                        <span className={`font-mono text-xl font-bold ${timeLeft <= 10 ? 'text-red-500' : 'text-[#f4e4c1]'}`}>{timeLeft}</span>
                                    </div>
                                </div>
                                <div className="p-8">
                                    <p className="text-xl text-[#f4e4c1] mb-8 font-serif italic border-l-4 border-[#b8860b] pl-4">"{gameState.activeEvent.description || gameState.activeEvent.text}"</p>
                                    <div className="grid gap-4">
                                        {gameState.activeEvent.type === 'question' && gameState.activeEvent.options.map((opt, idx) => (
                                            <button key={idx} onClick={() => submitAnswer(idx)} disabled={!isMyTurn} className="p-4 bg-[#0c0806] border border-[#3d2b1f] hover:border-[#b8860b] hover:bg-[#1f150f] text-left text-lg font-bold text-[#f4e4c1] disabled:opacity-70">{opt}</button>
                                        ))}
                                        {gameState.activeEvent.type === 'crisis' && gameState.activeEvent.options.map((opt, idx) => (
                                            <button key={idx} onClick={() => submitCrisisChoice(idx)} disabled={!isMyTurn} className="p-5 bg-[#0c0806] border-2 border-red-900 hover:bg-red-950 text-left disabled:opacity-70">
                                                <span className="block text-xl font-black text-[#f4e4c1] mb-1 uppercase font-serif">{opt.text}</span>
                                                <span className="block text-sm text-[#b8860b] uppercase font-bold">Риск: {opt.risk}</span>
                                            </button>
                                        ))}
                                    </div>
                                    {!isMyTurn && <p className="text-center text-[#b8860b] mt-6 uppercase font-bold text-sm animate-pulse">Ожидание решения князя...</p>}
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState.eventStatus === 'outcome' && gameState.activeEvent && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="max-w-xl w-full bg-[#17100b] border-2 border-[#b8860b] shadow-2xl">
                                <div className="p-6 text-center border-b border-[#3d2b1f] bg-[#1f150f]">
                                    <h3 className="text-2xl font-black uppercase text-[#ffd700] font-serif">{gameState.activeEvent.title}</h3>
                                </div>
                                <div className="p-8">
                                    <p className="text-lg text-[#f4e4c1] mb-8 font-serif">{gameState.activeEvent.message || gameState.activeEvent.story}</p>
                                    {gameState.activeEvent.deltas && (
                                        <div className="grid grid-cols-4 gap-4 mb-8">
                                            {[ { key: 'gold', label: 'КАЗНА', icon: '💰' }, { key: 'army', label: 'ДРУЖИНА', icon: '🛡️' }, { key: 'influence', label: 'ВЛИЯНИЕ', icon: '👑' }, { key: 'lands', label: 'ЗЕМЛИ', icon: '🗺️' } ].map(stat => {
                                                const val = gameState.activeEvent.deltas[stat.key];
                                                if (!val) return null;
                                                return (
                                                    <div key={stat.key} className="bg-[#0c0806] p-3 border border-[#3d2b1f] text-center">
                                                        <div className="text-2xl mb-2">{stat.icon}</div>
                                                        <div className="text-[10px] text-[#b8860b] uppercase font-bold">{stat.label}</div>
                                                        <div className={`text-xl font-black ${val > 0 ? 'text-green-500' : 'text-red-500'}`}>{val > 0 ? '+' : ''}{val}</div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    )}
                                    {isMyTurn ? (
                                        <button onClick={completeTurn} className="w-full bg-gradient-to-r from-[#b8860b] to-[#daa520] text-[#0c0806] py-4 font-black uppercase tracking-widest text-lg font-serif">Продолжить путь</button>
                                    ) : (
                                        <p className="text-center text-[#b8860b] uppercase font-bold">Ожидание активного игрока...</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
